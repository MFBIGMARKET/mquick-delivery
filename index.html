<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MQuick | Staff Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0" rel="stylesheet" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A59F7">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { margin: 0; background: #F5F7FA; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .portal-card { background: white; padding: 40px 24px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; border: 1px solid #EBF0F5; }
        .logo-icon { font-size: 56px; color: #0A59F7; margin-bottom: 8px; }
        h1 { font-size: 24px; font-weight: 800; color: #121826; margin: 0 0 8px 0; }
        p { color: #6B7280; font-size: 14px; margin: 0 0 32px 0; font-weight: 500; }
        
        .nav-btn { display: flex; align-items: center; gap: 16px; padding: 16px; background: #F8FAFC; border: 1px solid #EBF0F5; border-radius: 16px; text-decoration: none; color: #121826; font-weight: 700; margin-bottom: 12px; transition: 0.2s; text-align: left; }
        .nav-btn:hover { border-color: #0A59F7; background: #EFF6FF; color: #0A59F7; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(10, 89, 247, 0.1); }
        .nav-btn:active { transform: translateY(0); }
        
        .icon-box { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
        .btn-text { display: flex; flex-direction: column; }
        .btn-sub { font-size: 11px; color: #6B7280; font-weight: 500; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="portal-card">
        <span class="material-symbols-rounded logo-icon">storefront</span>
        <h1>MQuick Portal</h1>
        <p>Select your operational dashboard</p>

        <a href="/admin.html" class="nav-btn">
            <div class="icon-box" style="background: #0A59F7;"><span class="material-symbols-rounded">bolt</span></div>
            <div class="btn-text">
                <span>Command Center</span>
                <span class="btn-sub">Admin Dashboard & Live Map</span>
            </div>
        </a>

        <a href="/packer.html" class="nav-btn">
            <div class="icon-box" style="background: #00D166;"><span class="material-symbols-rounded">inventory_2</span></div>
            <div class="btn-text">
                <span>Packer Station</span>
                <span class="btn-sub">Order Verification</span>
            </div>
        </a>

        <a href="/rider.html" class="nav-btn" style="margin-bottom: 0;">
            <div class="icon-box" style="background: #121826;"><span class="material-symbols-rounded">two_wheeler</span></div>
            <div class="btn-text">
                <span>Rider Cockpit</span>
                <span class="btn-sub">Deliveries & Settlement</span>
            </div>
        </a>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW setup failed: ', err));
            });
        }
    </script>
</body>
</html>
